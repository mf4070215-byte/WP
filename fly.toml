app = "wp-whatapp"
primary_region = 'iad'

[build]

[http_service]
  internal_port = 443
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
